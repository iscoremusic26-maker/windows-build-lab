name: DEVF CP07.1 native editor MSVC
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'DEVF/CP07_1_NATIVE_EDITOR/**'
      - '.github/workflows/devf-cp07-1-native-editor.yml'
permissions:
  contents: read
jobs:
  build-editor:
    if: github.event.repository.private == true && github.repository == 'iscoremusic26-maker/codex-cp00-inputs' && github.head_ref == 'ci/devf-cp07-1-native-editor' && github.base_ref == 'ci/devf-cp06-json-dual-native-qa' && github.event.pull_request.base.sha == 'a9aabade816e8ea366b6f74a2cd731723a762ec1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Official SDK only, no host build
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TwilitRealm/dusklight
          ref: 40457c6adb381928e4b5fef6ed459ed291edd5e2
          path: .official
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64
      - name: Real shared core, editor persistence and callbacks
        shell: pwsh
        run: |
          python DEVF/CP07_1_NATIVE_EDITOR/ci/run_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'CP07 editor build/test/audit failed' }
      - name: Sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEVF_CP07_EDITOR_TEXT_${{ github.run_id }}
          path: ${{ runner.temp }}/devf-cp07-editor/evidence/
          retention-days: 30
          if-no-files-found: error
      - name: PRIVATE CP07.1 editor TEST
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEVF_CP07_1_EDITOR_TEST_${{ github.run_id }}
          path: ${{ runner.temp }}/devf-cp07-editor/TEST/
          retention-days: 30
          if-no-files-found: error
