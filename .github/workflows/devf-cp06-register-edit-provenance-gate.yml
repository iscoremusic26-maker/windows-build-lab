name: DEVF CP06 exact register-edit binary-symbol gate only
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/devf-cp06-register-edit-provenance-gate.yml'
      - 'DEVF/CP06_PROVENANCE_GATE/**'
permissions:
  contents: read
jobs:
  exact-symbol-measurement:
    if: github.event.repository.private == true && github.repository == 'iscoremusic26-maker/codex-cp00-inputs' && github.head_ref == 'ci/devf-cp06-register-edit-provenance-gate' && github.base_ref == 'ci/devf-cp06-second-site-source-review' && github.event.pull_request.base.sha == '98bbb027c91e4cabc9629f370971345c887a958c' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64
      - name: Read pinned official executable and embedded symbols; never execute host or install hooks
        shell: pwsh
        run: |
          git lfs pull --include=Dusklight-v2.0.3-win32-x86_64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Approved private Windows input unavailable' }
          python DEVF/CP06_PROVENANCE_GATE/ci/inspect_transfer_symbol.py
          if ($LASTEXITCODE -ne 0) { throw 'Exact-binary symbol measurement failed; no gate PASS' }
