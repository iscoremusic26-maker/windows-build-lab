name: DEVF native API provider and consumer MSVC
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'DEVF/NATIVE_API_PILOT/**'
      - '.github/workflows/devf-native-api-provider-probe.yml'
permissions:
  contents: read
jobs:
  build-api-pair:
    if: github.event.repository.private == true && github.repository == 'iscoremusic26-maker/codex-cp00-inputs' && github.head_ref == 'ci/devf-native-api-provider-probe' && github.base_ref == 'ci/devf-cp07-1-native-editor' && github.event.pull_request.base.sha == '8ceec3a417649701f2dcd0d23bfb0902fd85b3aa' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TwilitRealm/dusklight
          ref: 40457c6adb381928e4b5fef6ed459ed291edd5e2
          path: .official
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64
      - name: Native API, CP06 and editor regressions, PE and official package
        shell: pwsh
        run: |
          python DEVF/NATIVE_API_PILOT/ci/run_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'API pair build/lab/audit failed' }
      - name: Sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEVF_API_TEXT_${{ github.run_id }}
          path: ${{ runner.temp }}/devf-api/evidence/
          retention-days: 30
          if-no-files-found: error
      - name: PRIVATE provider TEST
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEVF_API_PROVIDER_TEST_${{ github.run_id }}
          path: ${{ runner.temp }}/devf-api/PROVIDER/
          retention-days: 30
          if-no-files-found: error
      - name: PRIVATE independent consumer PROBE TEST
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEVF_API_PROBE_TEST_${{ github.run_id }}
          path: ${{ runner.temp }}/devf-api/PROBE/
          retention-days: 30
          if-no-files-found: error
