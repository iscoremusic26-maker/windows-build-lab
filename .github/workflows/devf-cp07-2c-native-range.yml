name: DEVF CP07.2C provider real download and original consumer ABI
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/devf-cp07-2c-native-range.yml'
      - 'DEVF/CP07_2C_EOC2_NATIVE_RANGE/ci/verify_cp072c_download.py'
      - 'DEVF/CP07_2C_EOC2_NATIVE_RANGE/ci/range-download-spec.json'
permissions:
  contents: read
  actions: read
jobs:
  actual-download-no-build:
    if: github.event.repository.private == true && github.repository == 'iscoremusic26-maker/codex-cp00-inputs' && github.head_ref == 'ci/devf-cp07-2c-eoc2-native-range-5000' && github.base_ref == 'ci/devf-cp07-2b-bokoblin-expansion' && github.event.pull_request.base.sha == 'cec8b53891fa842c462eafbee606a21571c6a552' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      DEVF_VERIFY_SHA: ${{ github.event.pull_request.head.sha }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download new provider and ORIGINAL expansion/probe/provider; no build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python DEVF/CP07_2C_EOC2_NATIVE_RANGE/ci/verify_cp072c_download.py
          if ($LASTEXITCODE -ne 0) { throw 'Independent actual download verification failed' }
