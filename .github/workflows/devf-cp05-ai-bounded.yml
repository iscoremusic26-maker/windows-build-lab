name: DEVF CP05 independent actual download verification
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/devf-cp05-ai-bounded.yml'
      - 'DEVF/CP05_AI_BOUNDED_PILOT/ci/verify_real_download.py'
      - 'DEVF/CP05_AI_BOUNDED_PILOT/ci/download-spec.json'
permissions:
  contents: read
  actions: read
jobs:
  real-fresh-download:
    if: github.event.repository.private == true && github.base_ref == 'inputs/devf-cp04-4-eoc2-black-bokoblin' && github.head_ref == 'ci/devf-cp05-ai-bounded-pilot' && github.event.pull_request.base.sha == '6b32ef995814e6a20924d6b6dd3fe5886a5ef3e0' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      DEVF_CI_HEAD: ${{ github.event.pull_request.head.sha }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download existing own artifacts and verify all ZIP layers, source ledger and PE without building
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python DEVF/CP05_AI_BOUNDED_PILOT/ci/verify_real_download.py
          if ($LASTEXITCODE -ne 0) { throw 'Independent real download verification failed' }
