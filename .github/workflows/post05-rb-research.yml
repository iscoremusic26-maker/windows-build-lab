name: POST05-RB research labs only
on:
  push:
    branches: ['ci/posture-post05-red-black-research']
permissions:
  contents: read
jobs:
  research:
    if: github.event.repository.private == true
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64
      - name: Exact CP21 policies and offline shadow; no mod or game execution
        shell: pwsh
        run: |
          python POSTURE_SYSTEM/POST05/RED_BLACK/tests/run_research.py --cp21 POSTURE_SYSTEM/POST05/RED_BLACK/vendor/cp21 --out research-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: POST05_RB_RESEARCH_${{ github.run_id }}
          path: research-evidence/
          retention-days: 30
          if-no-files-found: error
