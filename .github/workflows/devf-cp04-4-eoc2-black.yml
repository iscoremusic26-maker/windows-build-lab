name: DEVF CP04.4 actual private artifact download verification
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'DEVF/CP04_4_EOC2_BLACK_CONTINUATION/ci/verify_real_download.py'
      - 'DEVF/CP04_4_EOC2_BLACK_CONTINUATION/ci/download-spec.json'
      - '.github/workflows/devf-cp04-4-eoc2-black.yml'
permissions:
  contents: read
  actions: read
jobs:
  real-private-download:
    if: github.event.repository.private == true && github.base_ref == 'inputs/devf-cp04-4-eoc2-black-bokoblin' && github.head_ref == 'ci/devf-cp04-4-eoc2-black-implementation' && github.event.pull_request.base.sha == '6b32ef995814e6a20924d6b6dd3fe5886a5ef3e0' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      DEVF_CI_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: DEVF/CP04_4_EOC2_BLACK_CONTINUATION
      - name: Download actual private TEST and evidence ZIPs, independently verify all layers, never compile/load/run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python DEVF/CP04_4_EOC2_BLACK_CONTINUATION/ci/verify_real_download.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual download verification failed; TEST readiness withheld' }
