name: DEVF CP01 G4B observation package ONLY
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'DEVF/CP01_G4B_PACKAGE_DELIVERY/**'
      - '.github/workflows/devf-cp01-g4b-package.yml'
permissions:
  contents: read
jobs:
  g4b-package:
    if: github.event.repository.private == true && github.base_ref == 'ci/devf-cp01-g4b-readonly' && github.head_ref == 'ci/devf-cp01-g4b-package' && github.event.pull_request.base.sha == '7e95661bdf9f93de7ed5a532e1b37150e70fe30f' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DEVF_CI_HEAD: ${{ github.event.pull_request.head.sha }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Exact reviewed observer, own packaging tools and private LFS input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /DEVF/CP01_G4B_PACKAGE_DELIVERY/
            /DEVF/CP01_G4B_LOCAL_READONLY_OBSERVER/
            /DEVF/CP01_A2_DISARMED_CONTROLLER/
            /DEVF/CP01_G2_READONLY_PACKAGE/
            /Dusklight-v2.0.3-win32-x86_64.zip
            /.github/workflows/
      - name: Official SDK at exact v2.0.3 root, never build host
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TwilitRealm/dusklight
          ref: 40457c6adb381928e4b5fef6ed459ed291edd5e2
          path: .official
          persist-credentials: false
      - name: Exact Aurora headers only
        shell: pwsh
        run: |
          git -C .official submodule update --init --depth 1 extern/aurora
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: MSVC x64 and Windows SDK
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64
      - name: Audit fresh DLL, explain historical hash, then official package and strict inspection
        shell: pwsh
        run: |
          python DEVF/CP01_G4B_PACKAGE_DELIVERY/ci/run_package.py --source .official --inputs . --work "$env:RUNNER_TEMP/g4b-readonly"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve sanitized text separately, no original resources or standalone binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEVF_CP01_G4B_PACKAGE_TEXT_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/g4b-readonly/package-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Publish exactly one audited observation package privately, REVIEW ONLY
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEVF_CP01_G4B_READ_ONLY_windows-amd64_17bbbd288f2e17974303f98fbfcd3345f49aa11d
          path: ${{ runner.temp }}/g4b-readonly/delivery/
          if-no-files-found: error
          retention-days: 30
