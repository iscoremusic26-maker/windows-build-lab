name: DEVF CP07.2A independent download and historical probe ABI
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/devf-cp07-2a-encounter-editor.yml'
      - 'DEVF/CP07_2A_ENCOUNTER_EDITOR/ci/verify_cp072a_download.py'
      - 'DEVF/CP07_2A_ENCOUNTER_EDITOR/ci/encounter-download-spec.json'
permissions:
  contents: read
  actions: read
jobs:
  actual-download-no-build:
    if: github.event.repository.private == true && github.repository == 'iscoremusic26-maker/codex-cp00-inputs' && github.head_ref == 'ci/devf-cp07-2a-encounter-editor' && github.base_ref == 'ci/devf-native-api-provider-probe' && github.event.pull_request.base.sha == '049e028b6f73dae0011966835bd6136322e81d3e' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      DEVF_VERIFY_SHA: ${{ github.event.pull_request.head.sha }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download CP07.2A and historical probe; verify all layers without building
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python DEVF/CP07_2A_ENCOUNTER_EDITOR/ci/verify_cp072a_download.py
          if ($LASTEXITCODE -ne 0) { throw 'Independent actual download verification failed' }
