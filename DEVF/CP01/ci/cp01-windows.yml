name: DEVF CP01 Windows Lifecycle Laboratory
on:
  pull_request:
    paths:
      - 'DEVF/CP01/**'
      - 'DEVF/ci/**'
      - '.github/workflows/devf-cp01-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private inputs and CP01 sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: true
          persist-credentials: false
      - name: Checkout only pinned public Aurora header dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: encounter/aurora
          ref: 3227d76c60e1e782ca576610bce61c9e7744d8be
          path: .cp00-deps/aurora
          sparse-checkout: include
          persist-credentials: false
      - name: Verify and prepare exact 2.0.3 inputs
        shell: pwsh
        run: |
          python DEVF/ci/verify_windows.py prepare --root . --work "$env:RUNNER_TEMP/cp01"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure and build with MSVC and Windows SDK
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP/cp01"
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          if (-not $vs) { throw 'MSVC x64 toolchain unavailable' }
          $major = [int]($vs[0].installationVersion.Split('.')[0])
          $generators = @{17='Visual Studio 17 2022'; 18='Visual Studio 18 2026'}
          $generator = $generators[$major]
          if (-not $generator) { throw "Unsupported Visual Studio major: $major" }
          cmake -S DEVF/CP01 -B "$work/build" -G $generator -A x64 "-DCMAKE_GENERATOR_INSTANCE=$($vs[0].installationPath)" "-DDUSK_DIR=$work/dusklight-2.0.3" "-DDUSK_GAME_EXE=$work/windows-amd64.lib" "-DDUSK_AURORA_DIR=$env:GITHUB_WORKSPACE/.cp00-deps/aurora" 2>&1 | Tee-Object "$work/evidence/configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$work/build" --config RelWithDebInfo --target devf_cp01_package devf_cp01_lifecycle_lab --parallel 2 --verbose 2>&1 | Tee-Object "$work/evidence/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run CP01 lifecycle and rollback laboratory
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP/cp01"
          ctest --test-dir "$work/build" -C RelWithDebInfo --output-on-failure --verbose 2>&1 | Tee-Object "$work/evidence/lifecycle-lab.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native package, exports and game linkage
        shell: pwsh
        run: |
          python DEVF/CP01/ci/verify_cp01.py --root . --work "$env:RUNNER_TEMP/cp01"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload only CP01 evidence and build-only diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEVF_CP01_BUILD_ONLY_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/cp01/evidence/
          if-no-files-found: error
          retention-days: 14
