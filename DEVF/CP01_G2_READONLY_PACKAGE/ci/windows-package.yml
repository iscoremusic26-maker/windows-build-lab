name: DEVF CP01 G2 READ_ONLY Windows AMD64 package
on:
  pull_request:
    paths:
      - 'DEVF/CP01_G2_READONLY_PACKAGE/**'
      - '.github/workflows/devf-cp01-g2-readonly.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DEVF_CI_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout private inputs and reviewed own sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /DEVF/CP01_G2_READONLY_PACKAGE/
            /Dusklight-v2.0.3-win32-x86_64.zip
            /.github/workflows/
      - name: Checkout exact public official SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TwilitRealm/dusklight
          ref: 40457c6adb381928e4b5fef6ed459ed291edd5e2
          path: .official
          persist-credentials: false
      - name: Pinned Aurora header dependency only
        shell: pwsh
        run: |
          git -C .official submodule update --init --depth 1 extern/aurora
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: MSVC x64 tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64
      - name: Safety gate, build, affected lab, SDK package and strict verification
        shell: pwsh
        run: |
          python DEVF/CP01_G2_READONLY_PACKAGE/ci/run_windows.py --source .official --inputs . --work "$env:RUNNER_TEMP/g2-readonly"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = (Get-Content DEVF/CP01_G2_READONLY_PACKAGE/CI_SOURCE.json | ConvertFrom-Json).own_source_commit
          "DEVF_COMPILED_MAIN_COMMIT=$source" >> $env:GITHUB_ENV
      - name: Upload textual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEVF_CP01_G2_TEXT_EVIDENCE_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/g2-readonly/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified own observer privately for review only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEVF_CP01_G2_READ_ONLY_windows-amd64_${{ env.DEVF_COMPILED_MAIN_COMMIT }}
          path: ${{ runner.temp }}/g2-readonly/delivery/
          if-no-files-found: error
          retention-days: 14
